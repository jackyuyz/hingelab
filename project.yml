name: HingeLab
options:
  bundleIdPrefix: com.jackyu
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  FoldKit:
    path: Packages/FoldKit
  HingeInput:
    path: Packages/HingeInput
  Synth:
    path: Packages/Synth
  Instruments:
    path: Packages/Instruments
  Looper:
    path: Packages/Looper
  MIDIOut:
    path: Packages/MIDIOut
  Store:
    path: Packages/Store
  SettingsKit:
    path: Packages/SettingsKit
  ThemeKit:
    path: Packages/ThemeKit
  HingeL10n:
    path: Packages/HingeL10n

targets:
  HingeLab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    resources:
      - path: App/Resources
        excludes:
          - "**/.DS_Store"
      - path: Configuration.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.hingelab
        PRODUCT_NAME: HingeLab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        DEVELOPMENT_LANGUAGE: en
    dependencies:
      - package: FoldKit
      - package: HingeInput
      - package: Synth
      - package: Instruments
      - package: Looper
      - package: MIDIOut
      - package: Store
      - package: SettingsKit
      - package: ThemeKit
      - package: HingeL10n
    entitlements:
      path: App/HingeLab.entitlements

  HingeLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.hingelab.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: HingeLab

  HingeLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.hingelab.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: HingeLab

schemes:
  HingeLab:
    build:
      targets:
        HingeLab: all
        HingeLabTests: [test]
        HingeLabUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-FoldDebugOverlay": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HingeLabTests
        - HingeLabUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HingeLab-MockHinge:
    build:
      targets:
        HingeLab: all
    run:
      config: Debug
      # XcodeGen maps each key to one argument string and the value to its checkbox,
      # so the -FoldMock value must be part of the key. Tick one alternative at a time.
      commandLineArguments:
        "-UITestMode 1": true
        "-FoldMock sweep:10-180:6": true
        "-FoldMock open": false
        "-FoldMock closed": false
        "-FoldMock half:95": false
        "-FoldMock nohinge": false
        "-FoldDebugOverlay": true
